version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: rag-backend-prod
    restart: always
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-rag_products}
      - UPLOAD_DIR=/app/uploads
      - DATA_DIR=/app/data
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-5}
      - MODULE_NAME=app.main
      - VARIABLE_NAME=app
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      - ./media:/app/media:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: rag-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  whatsapp:
    build:
      context: ./whatsapp-service
    container_name: rag-whatsapp-prod
    restart: always
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:8000
    volumes:
      - whatsapp-auth:/app/.wwebjs_auth
      - whatsapp-cache:/app/.wwebjs_cache
    depends_on:
      - backend
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  whatsapp-auth:
  whatsapp-cache:
