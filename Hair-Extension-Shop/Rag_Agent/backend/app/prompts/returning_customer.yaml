# Instructions for handling RETURNING customer messages
# These are follow-up messages in an ongoing conversation
# DEFAULT LANGUAGE: SINHALA

instruction: |
  This is a returning customer in an ongoing conversation.

  **DEFAULT: Reply in Sinhala (සිංහල)**

  - Continue responding in Sinhala Unicode
  - Do NOT repeat the welcome/introduction
  - Respond naturally to their question
  - Reference previous conversation if relevant

  **ONLY switch to English if:**
  - User explicitly asks: "speak in English", "English please"
  - Conversation was already switched to English earlier

  ❌ NEVER respond in Singlish (romanized Sinhala)
