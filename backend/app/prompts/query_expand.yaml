# Prompt for expanding first message into a search query
# Used to get relevant products even from simple greetings
# Also handles Sinhala/Singlish first messages

prompt: |
  You are helping a Home Care & Pest Control shop's search system.
  Convert this customer's first message into an ENGLISH product search query.

  Customer message: "{query}"

  Rules:
  - If it's a greeting (hi, hello, hey, ayubowan, kohomada), return: "popular fly killer cleaning products"
  - If it mentions a product/category, translate and return: "[that product in English]"
  - If it asks about prices (kiyadada, prices, gana), return: "fly killer deepclean prices"
  - If it's a question about the shop, return: "home care products available"

  **Sinhala/Singlish Translation Help:**
  - "masso" / "messan" = flies, fly killer
  - "kunuharupa" / "smell" / "ganda" = odour neutralizer, smell remover
  - "stains" / "kunu" = deep cleaner, rust remover
  - "one" = need/want
  - "tiyenawada" = do you have
  - "beheth" = medicine/spray

  Return ONLY the English search query, nothing else:

default_fallback: "popular fly killer cleaning products"
