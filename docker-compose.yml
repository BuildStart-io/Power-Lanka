services:
  # Backend - FastAPI/Python
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: power-lanka-backend
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-rag_products}
      - UPLOAD_DIR=/app/uploads
      - DATA_DIR=/app/data
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-5}
      - WHATSAPP_API_BEARER_TOKEN=${WHATSAPP_API_BEARER_TOKEN}
      - WHATSAPP_WEBHOOK_SIGNATURE=${WHATSAPP_WEBHOOK_SIGNATURE}
      - WASENDER_API_URL=${WASENDER_API_URL}
      - WASENDER_DEVICE_ID=${WASENDER_DEVICE_ID}
      - WASENDER_TIMEOUT=${WASENDER_TIMEOUT:-10}
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      - ./media:/app/media:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend - React/Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://powerlanka.buildstart.io/api}
    container_name: power-lanka-dashboard
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
  # WhatsApp Service - Node.js
